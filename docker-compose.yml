services:

  postgres:
    image: postgres:17
    container_name: observatorio-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: observatorio
      POSTGRES_USER: observatorio
      POSTGRES_PASSWORD: observatorio_dev

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observatorio -d observatorio"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data: